<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Dealory Admin</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{
font-family:Arial;
padding:40px;
background:#F5F5F0;
}

input{
display:block;
margin:10px 0;
padding:10px;
width:300px;
}

button{
padding:10px;
background:#C9A227;
border:none;
color:white;
cursor:pointer;
}
</style>

</head>

<body>

<h2>Add Product</h2>

<input id="name" placeholder="Product name">
<input id="image" placeholder="Image URL">
<input id="affiliate" placeholder="Affiliate link">

<button id="addProduct">Add Product</button>

<h2>Add Price</h2>

<input id="product_id" placeholder="Product ID">
<input id="price" placeholder="Price">
<input id="store" placeholder="Store name">

<button id="addPrice">Add Price</button>

<script>

const supabaseClient = window.supabase.createClient(
"https://xbaxcymfcqjmhqargjrh.supabase.co",
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhiYXhjeW1mY3FqbWhxYXJnanJoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIxMTc4MDEsImV4cCI6MjA4NzY5MzgwMX0.-4TMZcXwLIuiDqRPma6eVvenF6g5KV89jHrWOmnjX54"
);

document.getElementById("addProduct").onclick = async function(){

const name=document.getElementById("name").value;
const image=document.getElementById("image").value;
const affiliate=document.getElementById("affiliate").value;

const {error}=await supabaseClient.from("products").insert([
{
name:name,
image_url:image,
affiliate_url:affiliate
}
]);

if(error){
alert(error.message);
}else{
alert("Product added");
}

};

document.getElementById("addPrice").onclick = async function(){

const product_id=document.getElementById("product_id").value;
const price=document.getElementById("price").value;
const store=document.getElementById("store").value;

const {error}=await supabaseClient.from("product_prices").insert([
{
product_id:product_id,
price:price,
store:store
}
]);

if(error){
alert(error.message);
}else{
alert("Price added");
}

};

</script>

</body>
</html>
