<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Dealory</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

body{
font-family:Arial;
background:#F5F5F0;
padding:40px;
}

h1{
color:#0f0f0f;
}

.product{
background:white;
padding:20px;
margin:20px 0;
border-radius:8px;
box-shadow:0 2px 8px rgba(0,0,0,0.1);
width:300px;
}

img{
width:100%;
}

button{
background:#C9A227;
border:none;
padding:10px;
color:white;
cursor:pointer;
}

</style>

</head>

<body>

<h1>Dealory</h1>

<div id="products"></div>

<script>

const supabase = window.supabase.createClient(
"https://xbaxcymfcqjmhqargjrh.supabase.co",
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhiYXhjeW1mY3FqbWhxYXJnanJoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIxMTc4MDEsImV4cCI6MjA4NzY5MzgwMX0.-4TMZcXwLIuiDqRPma6eVvenF6g5KV89jHrWOmnjX54"
);

async function loadProducts(){

const {data:products}=await supabase
.from("products")
.select("*");

const container=document.getElementById("products");

products.forEach(product=>{

const div=document.createElement("div");

div.className="product";

div.innerHTML=`
<img src="${product.image_url}">
<h3>${product.name}</h3>
<a href="${product.affiliate_url}" target="_blank">
<button>View Deal</button>
</a>
`;

container.appendChild(div);

});

}

loadProducts();

</script>

</body>
</html>
